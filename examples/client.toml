psk = "change-me"
pinned_spki_sha256 = "replace-with-output-of-nya-server-gen-cert"

# Topology, probe budget, give-up. Health / failback / class formula live
# in nya_core::Tuning and are not set here.
# Unknown keys under [session] are a parse error (no aliases).
[session]
ping_interval_min_ms = 10
ping_interval_max_ms = 50
all_down_timeout_ms = 8000
max_paths = 32

# Observability. Log level for stderr is RUST_LOG only (e.g. nya_core=debug).
# snapshot_interval_ms = 0 disables the 10s snapshot. metrics_listen must
# be a numeric loopback SocketAddr (not localhost / 0.0.0.0).
# [obs]
# snapshot_interval_ms = 10000
# metrics_listen = "127.0.0.1:9100"
# instance_name = "edge-sh-03"   # must differ from the server instance_name
#
# Remote OTLP (default off). instance_name is required when enabled.
# No username/password keys: HTTP Basic/Bearer go in [obs.otel.headers].
# Query/fragment only on a full /v1/{signal} URL; tokens in headers.
# HTTP parent is a base; nya-obs appends /v1/traces|metrics|logs.
# [obs.otel]
# enabled = true
# endpoint = "http://127.0.0.1:4318"
# protocol = "http/protobuf"   # or grpc (rebuild --features otel-grpc)
# gzip = true
# timeout_ms = 5000
# export_interval_ms = 10000   # metrics push only
# sample_ratio = 1.0
# environment = "prod"
# redact_targets = false       # OTLP logs only
# [obs.otel.headers]
# Authorization = "Basic dXNlcjpwYXNz"   # printf 'user:pass' | base64
# # Authorization = "Bearer change-me"
# [obs.otel.traces]
# enabled = true
# [obs.otel.metrics]
# enabled = true
# [obs.otel.logs]
# enabled = true
# level = "info"               # stderr is still RUST_LOG
# queue_size = 8192
# batch_size = 512
# delay_ms = 5000
# Emergency off: OTEL_SDK_DISABLED=true
# Headers env: OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic\ dXNlcjpwYXNz

# Independent TCP+TLS connections per link (default 2). Isolates HOL
# on one connection from the rest of the traffic on the same link.
[[links]]
name = "a"
addr = "203.0.113.1:443"
connections = 2

[[links]]
name = "b"
addr = "203.0.113.2:443"
connections = 2

[[links]]
name = "c"
addr = "203.0.113.3:443"
connections = 2

[[inbounds]]
type = "socks5"
listen = "127.0.0.1:1080"

[[inbounds]]
type = "forward"
listen = "127.0.0.1:2222"
target = "127.0.0.1:22"
