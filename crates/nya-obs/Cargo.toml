[package]
name = "nya-obs"
description = "OpenTelemetry export layer for nya-client / nya-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
grpc = [
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/tls-ring",
    "opentelemetry-otlp/gzip-tonic",
]

[dependencies]
nya-core.workspace = true
anyhow.workspace = true
libc.workspace = true
opentelemetry = { version = "0.31", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "gzip-http",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.32"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }

[dev-dependencies]
nya-core = { workspace = true }
rustls.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
